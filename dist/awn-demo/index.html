<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#8a1538">
    <meta name="description" content="بوابة الدخول إلى منظومة عون التعليمية.">
    <meta name="awn-api-base-url" content="">
    <meta name="awn-demo-mode" content="true">
    <title data-i18n="pageTitle">بوابة عون التعليمية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/index.css">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script defer src="js/config/app-config.js"></script>
    <script type="module" src="js/features/auth.js"></script>
  </head>
  <body class="login-page">
    <header class="login-page__header">
      <a class="brand" href="index.html" aria-label="عون — الصفحة الرئيسية">
        <img class="brand__logo" src="assets/images/awn_logo.jpg" alt="شعار منصة عون">
        <span class="brand__name">عون</span>
      </a>
      <button class="language-toggle" type="button" data-language-toggle aria-label="Switch language">English</button>
    </header>

    <main class="login-page__main">
      <section class="login-card" aria-labelledby="login-title">
        <div class="login-card__heading">
          <p class="login-card__eyebrow" data-i18n="portalLabel">وزارة التربية والتعليم</p>
          <h1 class="login-card__title" id="login-title" data-i18n="heading">المنظومة الوطنية لإدارة التعليم</h1>
          <p class="login-card__description" data-i18n="description">سجّل الدخول للمتابعة إلى بوابة عون التعليمية.</p>
        </div>

        <div class="form-alert" data-error role="alert" aria-live="assertive" hidden></div>
        <p class="form-status" data-status role="status" aria-live="polite"></p>

        <form class="login-form" data-auth-form novalidate>
          <div class="form-field">
            <label class="form-field__label" for="national-id" data-i18n="usernameLabel">الرقم الوطني / اسم المستخدم</label>
            <input class="form-field__input" id="national-id" name="username" type="text" autocomplete="username" inputmode="text" required aria-describedby="username-help">
            <p class="form-field__hint" id="username-help" data-i18n="usernameHint">أدخل بيانات الدخول المعتمدة لك.</p>
          </div>

          <div class="form-field">
            <label class="form-field__label" for="password" data-i18n="passwordLabel">كلمة المرور</label>
            <div class="password-field">
              <input class="form-field__input password-field__input" id="password" name="password" type="password" autocomplete="current-password" required>
              <button class="password-field__toggle" type="button" data-password-toggle aria-pressed="false" data-i18n-aria="showPassword" aria-label="إظهار كلمة المرور">
                <span data-password-icon aria-hidden="true">◉</span>
              </button>
            </div>
          </div>

          <button class="login-form__submit" type="submit" data-submit>
            <span data-submit-label data-i18n="submit">تسجيل الدخول</span>
            <span class="login-form__spinner" data-spinner aria-hidden="true" hidden></span>
          </button>
          <p class="login-form__support" data-i18n="support">تحتاج مساعدة؟ تواصل مع مسؤول النظام في مدرستك.</p>
        </form>
      </section>
    </main>

    <footer class="login-page__footer">
      <p data-i18n="copyright">© وزارة التربية والتعليم — المملكة الأردنية الهاشمية</p>
    </footer>
  </body>
</html>
